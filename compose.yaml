# Local full-stack deployment (Phase 8). Loopback only; synthetic data only; $0.
#   docker compose up -d --build        # then open http://127.0.0.1:8080
#   docker compose down                 # stop (the demo database stays in the rih-data volume)
#   docker compose down -v              # reset (deletes the local demo database)
name: rih

services:
  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: rih-backend:local
    environment:
      RIH_ENV: ${RIH_ENV:-production}
      RIH_DB_PATH: /data/rih.sqlite3
      RIH_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      RIH_COOKIE_SECURE: "false"   # loopback HTTP demo only; use HTTPS and "true" anywhere else
      RIH_TRUST_PROXY: "true"      # X-Forwarded-For is set (not appended) by the project's own nginx
      RIH_INCIDENT_SIMULATION: ${RIH_INCIDENT_SIMULATION:-false}
      STRANDS_ENABLED: "false"
      RIH_PLANNER: RULE
      RIH_LOG_FORMAT: json
    volumes:
      - rih-data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: rih-frontend:local
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, edge]
    depends_on:
      backend:
        condition: service_started   # the UI starts even when the API is down and shows a clear error
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  internal:
    internal: true   # the API has no route to the internet; ingestion is disabled in this deployment
  edge: {}

volumes:
  rih-data: {}
