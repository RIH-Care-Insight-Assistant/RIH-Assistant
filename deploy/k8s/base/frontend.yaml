apiVersion: apps/v1
kind: Deployment
metadata:
  name: rih-frontend
  labels:
    app.kubernetes.io/name: rih-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rih-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rih-frontend
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: rih-frontend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            # nginx's resolver does not use search domains, so the service name is fully qualified.
            - name: BACKEND_UPSTREAM
              value: http://rih-backend.rih.svc.cluster.local:8000
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rih-frontend
  labels:
    app.kubernetes.io/name: rih-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rih-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rih-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rih-frontend
