# Local kind overlay. The bootstrap Secret is generated from bootstrap.env, which
# scripts/k8s.py writes with a random password at deploy time; that file is gitignored.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: rih-backend
    newName: rih-backend
    newTag: local
  - name: rih-frontend
    newName: rih-frontend
    newTag: local
secretGenerator:
  - name: rih-bootstrap
    namespace: rih
    envs:
      - bootstrap.env
    options:
      disableNameSuffixHash: true
